name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  scripts:
    name: Scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The OS image's shell scripts (BusyBox sh): every file under os/
      # starting with #!/bin/sh. Settings in .shellcheckrc
      - run: git grep -lz '^#!/bin/sh' -- os | xargs -0 shellcheck

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The build without NAM nor TONE3000 (no cmake / C++)
      - run: cargo clippy --all-targets --locked --no-default-features --features winit,lv2,midi -- -D warnings
      # GPIO footswitches and encoders, built only for the Pi image
      - run: cargo clippy --all-targets --locked --features gpio -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-24.04
    # The runner has 16 GB. The Slint UI is in the app binary, and one
    # rustc of it takes about 8.5 GB without debug info. `cargo test`
    # builds the binary and its unit tests at once: 16 GB, out of memory.
    # So the first step builds the binary (with the lib and the
    # integration tests), and the second one its unit tests alone.
    # At job level, rust-cache hashes these settings into its key, so the
    # saved cache matches the build and the dependencies are not rebuilt.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --no-run --test '*'
      - run: cargo test --locked
