[package]
name = "openrig-rig"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "The shareable OpenRig rig format (.openrig): a preset with the manifest of what it needs"
repository = "https://github.com/Siryu6/OpenRig"
readme = "README.md"
keywords = ["openrig", "guitar", "pedalboard", "preset", "lv2"]
# No platform code: builds for any target (pedalboard, server, wasm)
rust-version = "1.80"
# Shared with the community site through git, not crates.io (yet)
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
