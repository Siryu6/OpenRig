# rtpmidid on the pedalboard OS: Network MIDI (docs/MIDI.md). Started by
# /usr/libexec/pedalboard/network-midi, as user pedalboard, only when Network
# MIDI is on in Settings → MIDI; the session name chosen there is given with
# --rtpmidid-name.

[general]
alsa_name=rtpmidid
control=/run/rtpmidid/control.sock
log_level=info

# The session computers connect to: UDP 5004 (control) and 5005 (MIDI).
# Each connection becomes an ALSA port named after the remote session; the
# app listens to it once the device is allowed.
[rtpmidi_announce]
name={{hostname}}
port=5004

# Sessions announced by others show up as ALSA ports. The app never
# subscribes to them (that would open a connection to every RTP-MIDI device
# on the network): computers connect to the pedalboard, not the reverse.
[rtpmidi_discover]
enabled=true
name_negative_regex=^$
name_positive_regex=.*

# No [alsa_announce] and no [alsa_hw_auto_export]: the pedalboard's own MIDI
# devices are never exported to the network.
