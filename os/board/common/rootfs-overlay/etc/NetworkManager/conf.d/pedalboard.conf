[main]
# The UI runs as the pedalboard user and drives Wi-Fi through nmcli; there
# is no polkit on the image
auth-polkit=false
# The remote control's hotspot only serves the pedal (no NAT to another
# network), and the image has no nft or iptables
firewall-backend=none

[connection]
# Keep the Wi-Fi radio awake: power saving adds latency spikes
wifi.powersave=2
