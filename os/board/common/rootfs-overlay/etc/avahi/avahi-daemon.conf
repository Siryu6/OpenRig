# avahi-daemon on the pedalboard OS: only runs while Network MIDI is on
# (/usr/libexec/pedalboard/network-midi), to announce its RTP-MIDI session
# (_apple-midi._udp) and the host name <hostname>.local. The interfaces are
# added when it starts: the wired and Wi-Fi ones (no loopback, no VPN).
# No other service is published (no /etc/avahi/services), nor the machine
# type (hinfo) or a workstation record.

[server]
use-ipv4=yes
use-ipv6=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
enable-wide-area=no

[publish]
publish-hinfo=no
publish-workstation=no
publish-domain=no
publish-addresses=yes

[reflector]
enable-reflector=no

[rlimits]
