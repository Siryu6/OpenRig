# System updates (RAUC), see /usr/sbin/pedalboard-update. Partitions:
# board/rpi5/genimage.cfg.in.
[system]
compatible=pedalboard-rpi5
bootloader=custom
data-directory=/data/rauc
mountprefix=/run/rauc
bundle-formats=-plain

[handlers]
bootloader-custom-backend=/usr/libexec/pedalboard/rauc-backend
post-install=/usr/libexec/pedalboard/rauc-post-install

[keyring]
path=/etc/rauc/keyring.pem
# Check the certificate at the time the bundle was signed: the board may
# have no clock yet (no battery, offline update from a USB stick)
use-bundle-signing-time=true

[slot.rootfs.0]
device=/dev/disk/by-partuuid/5eda1b0a-7007-4000-8000-00000000000a
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partuuid/5eda1b0a-7007-4000-8000-00000000000b
type=ext4
bootname=B

[slot.boot.0]
device=/dev/disk/by-partuuid/5eda1b0a-b007-4000-8000-00000000000a
type=vfat
parent=rootfs.0

[slot.boot.1]
device=/dev/disk/by-partuuid/5eda1b0a-b007-4000-8000-00000000000b
type=vfat
parent=rootfs.1
