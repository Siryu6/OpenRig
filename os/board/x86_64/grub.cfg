# Boot slots (see /usr/sbin/pedalboard-update): the environment block
# holds the default slot, "primary", and a slot to start once, "try",
# cleared here before starting it. If that slot does not start, the next
# start is on the default one again.
set default=0
set fallback=1
set timeout=0

load_env --file $prefix/grubenv primary try
if [ "$try" = A -o "$try" = B ]; then
	set slot=$try
	set try=
	save_env --file $prefix/grubenv try
else
	set slot=$primary
fi
if [ "$slot" != B ]; then set slot=A; fi
if [ "$primary" != B ]; then set primary=A; fi

# The system slots are on the disk of this EFI partition: (hd0,gpt1)
regexp --set=1:disk '^([^,]+),' "$root"
set args="rootfstype=ext4 rootwait ro panic=10 rcutree.kthread_prio=90 quiet loglevel=3 vt.global_cursor_default=0 consoleblank=0 usbcore.autosuspend=-1"
export slot primary disk args

function boot_slot {
	if [ "$1" = B ]; then
		linux ($disk,gpt3)/boot/bzImage root=PARTUUID=0b5c1e7d-6a1f-4a8e-9d3b-70ed1b0a0003 rauc.slot=B $args
	else
		linux ($disk,gpt2)/boot/bzImage root=PARTUUID=0b5c1e7d-6a1f-4a8e-9d3b-70ed1b0a0002 rauc.slot=A $args
	fi
}

menuentry "Pedalboard" {
	boot_slot $slot
}

menuentry "Pedalboard (default slot)" {
	boot_slot $primary
}
