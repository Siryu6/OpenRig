# System updates (RAUC), see /usr/sbin/pedalboard-update. Partitions:
# board/x86_64/genimage.cfg. The kernel is in the system slot (/boot),
# where GRUB loads it from.
[system]
compatible=pedalboard-x86_64
bootloader=custom
data-directory=/data/rauc
mountprefix=/run/rauc
bundle-formats=-plain

[handlers]
bootloader-custom-backend=/usr/libexec/pedalboard/rauc-backend

[keyring]
path=/etc/rauc/keyring.pem
# Check the certificate at the time the bundle was signed: the board may
# have no clock yet (no battery, offline update from a USB stick)
use-bundle-signing-time=true

[slot.rootfs.0]
device=/dev/disk/by-partuuid/0b5c1e7d-6a1f-4a8e-9d3b-70ed1b0a0002
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partuuid/0b5c1e7d-6a1f-4a8e-9d3b-70ed1b0a0003
type=ext4
bootname=B
