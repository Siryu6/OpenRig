# Disk image (GPT):
#   1  PEDALBOARD  EFI: GRUB, its environment (boot slot), pedalboard.txt
#   2  system A    read-only root, with the kernel in /boot
# System B (3, same size as A) and data (4, the rest of the disk) are
# created on first boot. UUIDs: /etc/rauc/system.conf, grub.cfg.

image efi-part.vfat {
	vfat {
		label = "PEDALBOARD"
		file EFI {
			image = "efi-part/EFI"
		}
		file pedalboard.txt {
			image = "pedalboard.txt"
		}
	}

	size = 64M
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		offset = 1M
		bootable = true
	}

	partition system-a {
		partition-type-uuid = 4f68bce3-e8cd-4db1-96e7-fbcaf984b709
		partition-uuid = 0b5c1e7d-6a1f-4a8e-9d3b-70ed1b0a0002
		image = "rootfs.ext4"
		size = 1G
	}
}
