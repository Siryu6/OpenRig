[package]
name = "pedalboard"
version = "0.14.3"
edition = "2021"
license = "GPL-3.0-or-later"
# The rustc of the OS image (Buildroot): dependencies are resolved for it
rust-version = "1.99"
resolver = "3"

# The app and the crates it shares with other projects (the rig format
# with the community site). Both are built, checked and tested from here.
[workspace]
members = [".", "crates/openrig-rig"]
default-members = [".", "crates/openrig-rig"]

[lib]
name = "pedalboard"
path = "src/lib.rs"

[[bin]]
name = "pedalboard"
path = "src/main.rs"

# Boot splash of the pedalboard OS: draws a logo on the Linux framebuffer
# until the UI takes the display over
[[bin]]
name = "pedalboard-splash"
path = "src/bin/splash.rs"
required-features = ["splash"]

# Times the effect chain offline on one or more cores: `pedalboard-bench`
[[bin]]
name = "pedalboard-bench"
path = "src/bin/bench.rs"
required-features = ["nam"]

[features]
default = ["winit", "headless", "lv2", "nam", "tone3000", "midi", "update", "store", "rigs-online", "remote"]
# Desktop window (X11 / Wayland)
winit = ["slint/backend-winit", "slint/renderer-femtovg"]
# Full screen straight on the display (DRM/KMS + libinput), without X11 or
# Wayland: the pedalboard OS image. With winit too, it is the fallback when
# there is no display server. Needs libinput, libxkbcommon, libgbm and EGL.
kms = ["slint/backend-linuxkms-noseat", "slint/renderer-femtovg"]
# Runs without a touchscreen: the UI is drawn in memory (software
# renderer) and streamed to a phone or tablet by the web remote
headless = ["slint/renderer-software", "slint/software-renderer-path"]
# Real LV2 hosting through liblilv (system library: liblilv-dev / lilv)
lv2 = ["dep:lilv", "dep:lv2_raw"]
# Footswitches and rotary encoder on Raspberry Pi GPIO
gpio = ["dep:rppal", "dep:gpiocdev"]
# Built-in neural amp block (NAM / RTNeural models through NeuralAudio,
# built from third_party/NeuralAudio; needs cmake and a C++20 compiler)
nam = ["dep:cmake"]
# "TONE3000 Connect" in Settings: link a tone3000.com account (HTTPS client,
# QR code, decoders of the tone pictures and avatars)
tone3000 = ["dep:ureq", "dep:qrcodegen", "dep:zune-jpeg", "dep:png"]
# MIDI input from USB / DIN interfaces (ALSA on Linux: libasound2-dev / alsa-lib)
midi = ["dep:midir"]
# pedalboard-splash (Linux framebuffer)
splash = ["dep:png"]
# "Check for updates" in ⋮ → Updates: latest release on GitHub; on the
# pedalboard OS, downloads it and hands it to the system installer
update = ["dep:ureq", "dep:ring"]
# Plugin store: downloads the signed catalog index and installs LV2 bundles
# into the data directory (minisign check, tar.xz / tar.gz in pure Rust)
store = ["dep:ureq", "dep:ring", "dep:minisign-verify", "dep:lzma-rs"]
# openrig.eu in the Rigs panel: browse, download, favourite and publish rigs
# (HTTPS client, QR code of the link page)
rigs-online = ["dep:ureq", "dep:qrcodegen"]
# Remote control from a phone or tablet: a web app served by the pedal
# (HTTP + WebSocket, off until a password is set)
remote = ["dep:axum", "dep:tokio", "dep:argon2", "dep:getrandom", "dep:png", "dep:jpeg-encoder"]

[dependencies]
lilv = { version = "0.3.1", optional = true }
# femtovg (OpenGL): the UI draws icons and connectors with Path, which the
# software renderer does not support. Qt is left out (aborts without a display).
# The backend and the renderer come from the `winit` / `kms` features (without
# either, the app builds but has no display: tests, headless checks).
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-18"] }

# Audio
jack = "0.14"
# The latency callback, which `jack` does not wrap (same version as its own)
jack-sys = "0.7"
lv2_raw = { version = "0.3", optional = true }  # Same major as the one lilv uses, so LV2Feature types match

# Concurrency
crossbeam-channel = "0.5"  # Lock-free channels for RT-safe communication

# Shareable rigs (.openrig): the format, shared with the community site
openrig-rig = { path = "crates/openrig-rig" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System directories
dirs = "7"

# Date/time formatting
chrono = "0.4"

# GPIO (for Raspberry Pi hardware)
rppal = { version = "0.22", optional = true }  # I2C bus
gpiocdev = { version = "0.8", optional = true }  # GPIO lines, through the kernel
fft-convolver = "0.4"
# Spectrum of the EQ view (already used by fft-convolver)
realfft = "3.5"
hound = "3"
ureq = { version = "3.4", features = ["json"], optional = true }
ring = { version = "0.17", optional = true }  # SHA-256 of the updates (already in ureq's TLS)
qrcodegen = { version = "1.8", optional = true }
midir = { version = "0.11.0", optional = true }  # MIDI input: ALSA, CoreMIDI, WinMM
png = { version = "0.18", optional = true }
zune-jpeg = { version = "0.5", optional = true }
libc = "0.2"  # DSP workers: real-time scheduling
bytemuck = "1"  # Byte views of the LV2 atom buffers, without unsafe
minisign-verify = { version = "0.3", optional = true }
# .tar.gz: store archives, and the backups of Settings → Backup
tar = { version = "0.4", default-features = false }
flate2 = "1"
lzma-rs = { version = "0.3", optional = true }
# Web remote: HTTP / WebSocket server on one thread, password hashes
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json", "query"], optional = true }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"], optional = true }
argon2 = { version = "0.6", optional = true }
getrandom = { version = "0.4", optional = true }
# Frames of the full editor streamed to the browser
jpeg-encoder = { version = "0.7", optional = true }

[dev-dependencies]
blake2 = "0.11"  # minisign signatures of the store test

[build-dependencies]
slint-build = "1.18"
cmake = { version = "0.1.54", optional = true }

# The convolution must keep up in real time even in debug builds
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.fft-convolver]
opt-level = 3

# Inlining across crates (FFT, DSP, Slint) for the release and image builds
[profile.release]
lto = "thin"

[patch.crates-io]
# Slint's KMS backend asks for framebuffer modifiers even where the driver
# takes none (virtio-gpu in QEMU…): copy that retries without them
i-slint-backend-linuxkms = { path = "third_party/i-slint-backend-linuxkms" }

# Runtime robustness: no panicking shortcuts outside tests (clippy.toml lets
# tests use them), every unsafe block says why it is sound
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
